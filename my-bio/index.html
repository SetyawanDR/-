<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setyawan Dwi Rachmadhan - Links</title>
    <!-- Font Awesome untuk Ikon tombol -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts agar tulisan rapi -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Menghubungkan ke file desain CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container">
        <!-- Bagian Foto & Bio -->
        <div class="profile-section">
            <div class="profile-image-container">
                <!-- Pastikan nama file gambarnya sesuai: profile.jpg -->
                <img src="profile.jpg" alt="Profile Setyawan" class="profile-pic">
            </div>
            <h1 class="name">Setyawan Dwi Rachmadhan</h1>
            <p class="username">@setyawandr_</p>
            <p class="bio">Life itself is the most wonderful fairy tale.</p>
        </div>

        <!-- Bagian Tombol Link -->
        <div class="links-section">
            <a href="https://www.instagram.com/setyawandr_" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram"></i><span>Instagram 1</span>
            </a>
            <a href="https://www.instagram.com/just.shift_" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram"></i><span>Instagram 2</span>
            </a>
            <a href="https://www.linkedin.com/in/setyawan-dwi-rachmadhan-1886a024b/" target="_blank" class="link-btn">
                <i class="fa-brands fa-linkedin-in"></i><span>LinkedIn</span>
            </a>
            <a href="https://setyawandr16.wixsite.com/zxsty1" target="_blank" class="link-btn">
                <i class="fa-solid fa-globe"></i><span>Website</span>
            </a>
            <a href="https://steamcommunity.com/id/zxsty1_" target="_blank" class="link-btn">
                <i class="fa-brands fa-steam"></i><span>Steam</span>
            </a>
            <a href="https://open.spotify.com/user/sl7hqmr01yynoac5eyqnzjntq?si=5d13a6c448fd44d9" target="_blank" class="link-btn">
                <i class="fa-brands fa-spotify"></i><span>Spotify</span>
            </a>
        </div>

        <!-- Bagian Pemutar Musik Baru -->
        <div class="music-player-v2">
            <!-- Audio diatur untuk autoplay dan loop -->
            <audio id="myAudio" src="lagu.mp3" autoplay loop></audio>
            
            <img src="album.gif" alt="Album Art" class="album-art">
            
            <div class="music-details">
                <p class="song-title">photographic memory</p>
                <p class="artist">In Inertia</p>
                
                <div class="music-controls">
                    <span class="time" id="current-time">0:00</span>
                    <div class="progress-bar-container" id="progress-container" style="cursor: pointer;">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                        <div class="progress-dot" id="progress-dot"></div>
                    </div>
                    <span class="time" id="duration">4:04</span>
                    
                    <!-- Ikon Volume (bisa diklik untuk Mute) -->
                    <i class="fa-solid fa-volume-low volume-icon" id="mute-icon" style="cursor: pointer; padding-left: 5px;"></i>
                    <!-- Bar Volume (bisa diklik untuk atur suara) -->
                    <div class="volume-bar-container" id="volume-container" style="cursor: pointer;">
                        <div class="volume-bar-fill" id="volume-fill"></div>
                        <div class="volume-dot" id="volume-dot"></div>
                    </div>
                </div>
            </div>
        </div>
    
    <footer>
        <p>© 2026 Setyawan Dwi Rachmadhan</p>
    </footer>
<!-- Script untuk menjalankan lagu otomatis dan bar waktu -->
    <script>
        var audio = document.getElementById("myAudio");
        var progressFill = document.getElementById("progress-fill");
        var progressDot = document.getElementById("progress-dot");
        var currentTimeElem = document.getElementById("current-time");

        // Memaksa browser untuk mencoba memutar lagu saat halaman dimuat
        window.onload = function() {
            audio.play().catch(function(error) {
                console.log("Browser memblokir autoplay. Menunggu interaksi pengguna.");
            });
        };

        // Jika autoplay diblokir, lagu akan langsung berputar saat user mengklik bagian manapun di layar
        document.body.addEventListener('click', function() {
            if (audio.paused) {
                audio.play();
            }
        });

        // Script untuk menjalankan bar waktu dan titik (dot)
        audio.addEventListener("timeupdate", function() {
            var position = audio.currentTime / audio.duration;
            var percentage = position * 100;
            
            progressFill.style.width = percentage + "%";
            progressDot.style.left = percentage + "%";
            
            // Mengatur angka waktu
            var currentMinutes = Math.floor(audio.currentTime / 60);
            var currentSeconds = Math.floor(audio.currentTime % 60);
            if (currentSeconds < 10) { currentSeconds = "0" + currentSeconds; }
            currentTimeElem.innerText = currentMinutes + ":" + currentSeconds;
        });// Menangkap elemen volume dan progress
        var volumeContainer = document.getElementById("volume-container");
        var volumeFill = document.getElementById("volume-fill");
        var volumeDot = document.getElementById("volume-dot");
        var muteIcon = document.getElementById("mute-icon");
        var progressContainer = document.getElementById("progress-container");

        // Mengatur volume awal (60%)
        audio.volume = 0.6;
        volumeFill.style.width = "60%";
        volumeDot.style.left = "60%";

        // 1. FUNGSI MENGATUR VOLUME (Klik di garis volume)
        volumeContainer.addEventListener('click', function(e) {
            var rect = volumeContainer.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var percentage = Math.max(0, Math.min(100, (x / rect.width) * 100));
            
            // Ubah volume asli lagu (0.0 sampai 1.0)
            audio.volume = percentage / 100;
            
            // Ubah tampilan UI
            volumeFill.style.width = percentage + "%";
            volumeDot.style.left = percentage + "%";

            // Ubah ikon jika volume 0 (mute)
            if (audio.volume === 0) {
                muteIcon.className = "fa-solid fa-volume-xmark volume-icon";
            } else {
                muteIcon.className = "fa-solid fa-volume-low volume-icon";
            }
        });

        // 2. FUNGSI TOMBOL MUTE (Klik di ikon speaker)
        var previousVolume = 0.6;
        muteIcon.addEventListener('click', function() {
            if (audio.volume > 0) {
                previousVolume = audio.volume; // Simpan memori volume sebelumnya
                audio.volume = 0; // Matikan suara
                volumeFill.style.width = "0%";
                volumeDot.style.left = "0%";
                muteIcon.className = "fa-solid fa-volume-xmark volume-icon";
            } else {
                audio.volume = previousVolume; // Kembalikan ke memori sebelumnya
                volumeFill.style.width = (previousVolume * 100) + "%";
                volumeDot.style.left = (previousVolume * 100) + "%";
                muteIcon.className = "fa-solid fa-volume-low volume-icon";
            }
        });

        // 3. FUNGSI MEMPERCEPAT LAGU (Klik di garis lagu)
        progressContainer.addEventListener('click', function(e) {
            var rect = progressContainer.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var percentage = (x / rect.width);
            audio.currentTime = percentage * audio.duration;
        });
    </script>

    </script>
</body>
</html>
